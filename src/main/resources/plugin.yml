main: ${MAIN}
name: ${NAME}
version: "${VERSION}"
api-version: "26.1.2"
author: ${AUTHOR}
description: ${DESCRIPTION}
commands:
  berlioz:
    description: Server-initiated music broadcast (command-block friendly).
    usage: /berlioz <play <radius> <url> | stop | cache <radius> <url>>
permissions:
  berlioz.playlist:
    description: Allows launching/broadcasting a playlist (DJ). Listeners need no permission.
    default: op
  berlioz.ambient:
    description: Allows creating, editing, deleting and teleporting to ambient zones.
    default: op
  berlioz.command:
    description: Allows using /berlioz (server/command-block music). Command blocks are always allowed.
    default: op